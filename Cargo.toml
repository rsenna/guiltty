[workspace]
resolver = "2"
members = [
    "crates/guiltty-core",
    "crates/guiltty-sprite",
    "crates/guiltty-kitty",
    "crates/guiltty",
    "examples",
]

[workspace.package]
edition = "2021"
rust-version = "1.96.0"
license = "MIT"
authors = ["Rogério Senna"]
repository = "https://github.com/rsenna/guiltty"

[workspace.lints.clippy]
# Complexity/nesting "easy win" static analysis (docs/spec-ci.md). cognitive_complexity is
# deliberately NOT enabled here -- it's a `restriction`-group lint and its own docs
# recommend too_many_lines/excessive_nesting instead, calling itself a misleading metric.
too_many_lines = "warn"
excessive_nesting = "warn"

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mise.toml pins Rust to the workspace's declared MSRV; subsequent checks
      # compile and test the repository with that toolchain.
      - name: Install mise-managed tools (rust, cargo-llvm-cov)
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: Cache Cargo registry/git/target
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo llvm-cov (also runs the full test suite; fails if line coverage drops below 90%)
        run: cargo llvm-cov --workspace --summary-only --fail-under-lines 90

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mise.toml pins Rust to the workspace's declared MSRV; subsequent checks
      # compile and test the repository with that toolchain.
      - name: Install mise-managed tools (rust, cargo-llvm-cov)
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: Cache Cargo registry/git/target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo llvm-cov (also runs the full test suite; fails if line coverage drops below 90%)
        run: cargo llvm-cov --workspace --summary-only --fail-under-lines 90
